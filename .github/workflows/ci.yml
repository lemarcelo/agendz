name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      publicar_producao:
        description: Publicar o site em produção após os testes
        type: boolean
        default: false

env:
  TZ: America/Sao_Paulo   # as regras usam o horário local da loja (ex.: aviso às 9h); o runner vem em UTC

# Um push novo na mesma branch cancela o CI anterior que ainda roda (o último commit é o que vale; o deploy sai do último).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Rápido (cerca de 1 min): testes de unidade/estáticos e conferência de que o build fecha. Os testes de navegador rodam em paralelo nos jobs abaixo.
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Testes (dominio, seguranca, conflito, verificacoes estaticas)
        run: npm test
      - name: Build do artefato
        # Chave de autoria (marca de build assinada): guarde em Settings > Secrets > AUTORIA_SEGREDO. Sem ela o build sai sem assinatura verificável.
        env:
          AUTORIA_SEGREDO: ${{ secrets.AUTORIA_SEGREDO }}
        run: npm run build

  # Testes de navegador (Playwright) divididos em 3 fatias que rodam ao mesmo tempo, cada uma num computador próprio (os testes são independentes).
  navegador:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fatia: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package.json') }}
      - run: npx playwright install --with-deps chromium   # com o cache só instala as dependências do sistema
      - run: npm run build
      - name: Navegador, fatia ${{ matrix.fatia }} de 3
        env:
          E2E_FRACAO: ${{ matrix.fatia }}/3
          E2E_PARALELO: 2
        run: npm run e2e

  # Suíte da barbearia (Gate 1): unidade na fatia 1; navegador dividido em 2 fatias. O build da barbearia escreve em dist/, por isso cada fatia tem o próprio computador.
  barbearia:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fatia: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package.json') }}
      - run: npx playwright install --with-deps chromium
      - name: Unidade da barbearia
        if: matrix.fatia == 1
        run: node tools/rodar-testes-tipo.mjs barbearia unidade
      - run: node tools/rodar-testes-tipo.mjs barbearia build
      - name: Navegador da barbearia, fatia ${{ matrix.fatia }} de 2
        env:
          E2E_FRACAO: ${{ matrix.fatia }}/2
          E2E_PARALELO: 2
        run: node tools/rodar-testes-tipo.mjs barbearia e2e

  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Garantir Docker ativo para Testcontainers
        run: sudo systemctl restart docker || true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Testes do backend (Testcontainers sobe o PostgreSQL 16)
        run: |
          set -o pipefail
          mvn -B -ntp verify 2>&1 | tee mvn.log
      - name: Anotações de falha (texto dos erros visível pela API)
        if: failure()
        working-directory: .
        run: tools/anotar-falha-maven.sh backend/mvn.log backend/target

  deploy:
    # Publica o site na VPS depois que front e backend passam, só no main. Sem os segredos VPS_HOST e VPS_SSH_KEY, o passo é pulado (CI segue verde).
    needs: [testes, navegador, barbearia, backend, auditoria]
    if: github.ref == 'refs/heads/main' && ((github.event_name == 'push' && vars.DEPLOY_PRODUCAO_AUTOMATICO == 'true') || (github.event_name == 'workflow_dispatch' && inputs.publicar_producao == true))
    runs-on: ubuntu-latest
    env:
      TEM_CHAVE: ${{ secrets.VPS_SSH_KEY != '' && secrets.VPS_HOST != '' }}
      DOMINIO: ${{ vars.DOMINIO || 'agendz.io' }}
      # SITE_REAL=true (Settings > Variables): o site publicado passa a falar com a API real (login real). Sem a variável, continua a demonstração.
      SITE_REAL: ${{ vars.SITE_REAL || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - name: Aviso (sem segredos de deploy)
        if: env.TEM_CHAVE != 'true'
        run: |
          echo "::notice::Deploy pulado. Cadastre VPS_HOST e VPS_SSH_KEY em Settings > Secrets and variables > Actions."
      - uses: actions/setup-node@v4
        if: env.TEM_CHAVE == 'true'
        with:
          node-version: 22
      - name: Build do site publicado (com domínio)
        if: env.TEM_CHAVE == 'true'
        env:
          AUTORIA_SEGREDO: ${{ secrets.AUTORIA_SEGREDO }}
        run: |
          npm install --no-audit --no-fund
          AGENDZ_DOMINIO="$DOMINIO" node build.mjs
          AGENDZ_DOMINIO="$DOMINIO" node build.mjs --real
          if [ "$SITE_REAL" = "true" ]; then cp dist/index-real.html dist/index-site.html; else cp dist/index.html dist/index-site.html; fi
          echo "Site: $([ "$SITE_REAL" = "true" ] && echo 'API real' || echo 'demonstração')"
      - name: Envia para a VPS (troca atômica do index.html)
        if: env.TEM_CHAVE == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER || 'agendz' }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          if [ -n "$VPS_KNOWN_HOSTS" ]; then printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts; else ssh-keyscan -T 10 "$VPS_HOST" > ~/.ssh/known_hosts; fi
          OPTS="-i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
          scp $OPTS dist/index-site.html "$VPS_USER@$VPS_HOST:/opt/agendz/site/index.html.novo"
          # aviso com o app fechado (v130): service worker, manifesto e ícone na raiz do site (só o site real os usa)
          if [ "$SITE_REAL" = "true" ]; then scp $OPTS dist/sw.js dist/manifest.webmanifest dist/icone.svg "$VPS_USER@$VPS_HOST:/opt/agendz/site/"; fi
          ssh $OPTS "$VPS_USER@$VPS_HOST" 'mv -f /opt/agendz/site/index.html.novo /opt/agendz/site/index.html'
          echo "Site publicado em https://$DOMINIO"
          rm -f ~/.ssh/deploy_key

  auditoria:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Dependencias com falha conhecida
        run: npm audit --audit-level=high

  candidato-homologacao:
    # Somente prepara uma versão identificada; não sobe serviços nem altera produção.
    needs: [testes, navegador, barbearia, backend, auditoria]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/homologacao/') && vars.HOMOLOGACAO_AUTOMATICA == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Preparar site e imagem da versão candidata
        env:
          AUTORIA_SEGREDO: ${{ secrets.AUTORIA_SEGREDO }}
        run: |
          npm ci --no-audit --no-fund
          AGENDZ_DOMINIO=agendz.io node build.mjs --real
          docker build -t "agendz-homologacao-api:$GITHUB_SHA" backend
          git ls-tree -r "$GITHUB_SHA" -- backend/src/main/resources/db/migration > migracoes.tree
          [ -s migracoes.tree ]
          sha256sum migracoes.tree | awk '{print $1}' > dist/migracoes.sha256
      - name: Guardar versão candidata na VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER || 'agendz' }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          HOMOLOGACAO_ATUALIZAR_AUTOMATICO: ${{ vars.HOMOLOGACAO_ATUALIZAR_AUTOMATICO }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          [ -n "$VPS_HOST" ] && [ -n "$VPS_SSH_KEY" ] && [ -n "$VPS_KNOWN_HOSTS" ]
          install -m 700 -d ~/.ssh
          trap 'rm -f ~/.ssh/homologacao_key' EXIT
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/homologacao_key
          chmod 600 ~/.ssh/homologacao_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          opts=(-i ~/.ssh/homologacao_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)
          destino="/opt/agendz/homologacao/candidatos/agendz/$GITHUB_SHA"
          ssh "${opts[@]}" "$VPS_USER@$VPS_HOST" "mkdir -p /opt/agendz/homologacao/candidatos/agendz"
          if ssh "${opts[@]}" "$VPS_USER@$VPS_HOST" "test -f '$destino/pronto'"; then
            ssh "${opts[@]}" "$VPS_USER@$VPS_HOST" "test -s '$destino/image-id'"
            echo 'Candidato existente preservado.'
          else
            ssh "${opts[@]}" "$VPS_USER@$VPS_HOST" "mkdir '$destino'"
            docker save "agendz-homologacao-api:$GITHUB_SHA" | gzip | ssh "${opts[@]}" "$VPS_USER@$VPS_HOST" 'gunzip | docker load'
            scp "${opts[@]}" dist/index-real.html dist/sw.js dist/manifest.webmanifest dist/icone.svg dist/migracoes.sha256 "$VPS_USER@$VPS_HOST:$destino/"
            tar -cf - deploy/homologacao | ssh "${opts[@]}" "$VPS_USER@$VPS_HOST" "tar -xf - -C '$destino'"
            ssh "${opts[@]}" "$VPS_USER@$VPS_HOST" "docker image inspect --format '{{.Id}}' 'agendz-homologacao-api:$GITHUB_SHA' > '$destino/image-id' && touch '$destino/pronto'"
          fi
          if [ "$HOMOLOGACAO_ATUALIZAR_AUTOMATICO" = true ]; then
            ssh "${opts[@]}" "$VPS_USER@$VPS_HOST" "bash /opt/agendz/homologacao/atualizar-ambiente.sh agendz '$GITHUB_SHA'"
          fi
