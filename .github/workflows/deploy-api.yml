name: Deploy da API
# Publica a imagem da API no GHCR e atualiza a VPS. Só roda quando a variável de repositório DEPLOY_API for "true" (Settings > Secrets and variables > Actions > Variables)
# e os segredos VPS_HOST e VPS_SSH_KEY existirem. Nada mais é manual: o passo da VPS roda `preparar-api.sh` (gera POSTGRES_PASSWORD e JWT_SEGREDO sozinho, sem mostrar,
# na primeira vez) e entra no GitHub Packages com o token do próprio job (o pacote pode continuar privado; o login é desfeito no fim).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

env:
  TZ: America/Sao_Paulo

jobs:
  api:
    if: github.event.workflow_run.conclusion == 'success' && vars.DEPLOY_API == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ghcr.io/lemarcelo/agendz-api:latest
            ghcr.io/lemarcelo/agendz-api:${{ github.event.workflow_run.head_sha }}
      - name: Atualiza a VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER || 'agendz' }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          if [ -n "$VPS_KNOWN_HOSTS" ]; then printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts; else ssh-keyscan -T 10 "$VPS_HOST" > ~/.ssh/known_hosts; fi
          OPTS="-i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
          scp $OPTS deploy/docker-compose.yml deploy/docker-compose.api.yml deploy/Caddyfile deploy/preparar-api.sh deploy/provisionar-loja.sh "$VPS_USER@$VPS_HOST:/opt/agendz/"
          scp -r $OPTS deploy/logos "$VPS_USER@$VPS_HOST:/opt/agendz/"
          printf '%s' "$GH_TOKEN" | ssh $OPTS "$VPS_USER@$VPS_HOST" "docker login ghcr.io -u '$GH_ACTOR' --password-stdin"
          ssh $OPTS "$VPS_USER@$VPS_HOST" 'cd /opt/agendz && bash preparar-api.sh; r=$?; docker logout ghcr.io >/dev/null 2>&1; if [ $r -eq 0 ]; then docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile || r=$?; fi; exit $r'
          rm -f ~/.ssh/deploy_key
      - name: Teste no servidor real (smoke, só endpoints públicos)
        env:
          DOMINIO: ${{ vars.DOMINIO || 'agendz.io' }}
        run: |
          # a API leva alguns segundos para subir depois do `up -d`; espera até 3 min por 200 ou 404 (nunca 502)
          for i in $(seq 1 36); do
            cod=$(curl -s -m 10 -o /dev/null -w '%{http_code}' "https://apex.$DOMINIO/api/publico/loja" || true)
            if [ "$cod" = "200" ] || [ "$cod" = "404" ]; then break; fi
            echo "API ainda não respondeu (código $cod); tentativa $i/36"; sleep 5
          done
          bash deploy/smoke-producao.sh "$DOMINIO"
