spring:
  application:
    name: agendz-api
  datasource:
    url: ${AGENDZ_DB_URL:jdbc:postgresql://localhost:5432/agendz}
    username: ${AGENDZ_DB_USER:agendz}
    password: ${AGENDZ_DB_PASSWORD:agendz}
  flyway:
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: true   # campo desconhecido no corpo = 400 (nada de Object.assign do corpo inteiro)

# Nunca confiar em X-Forwarded-Host vindo de fora: a loja sai só do Host que o proxy (Caddy) repassa.
server:
  forward-headers-strategy: none

management:
  endpoints:
    web:
      exposure:
        include: health

agendz:
  # Subdomínios de UM rótulo destes domínios apontam para a loja (docs/F1-lojas-por-dns.md).
  dominios-base: ${AGENDZ_DOMINIOS_BASE:agendz.io,localhost}
  # ?loja=slug: só demonstração e desenvolvimento. Em produção fica false.
  permitir-query: ${AGENDZ_PERMITIR_QUERY:false}
  admin:
    # Admin API (chamados do Suporte; rede interna do Docker). Vazio = o Suporte responde 503. Usa a mesma INTERNO_CHAVE de agendz.interno.chave.
    url: ${ADMIN_INTERNO_URL:}
  interno:
    # Chave das rotas internas do Admin (/interno/plataforma/**, cabeçalho X-Interno-Chave). Sem ela (16+ caracteres) essas rotas respondem 503. A VPS a gera em .env (preparar-api.sh).
    chave: ${INTERNO_CHAVE:}
  jwt:
    # OBRIGATÓRIO em produção (env JWT_SEGREDO, mínimo 32 caracteres, aleatório). Sem ele a API não sobe.
    segredo: ${JWT_SEGREDO:}
    validade-minutos: ${JWT_VALIDADE_MINUTOS:480}
  cifra:
    # OBRIGATÓRIOS em produção (CIFRA_CHAVE e CIFRA_PEPPER, aleatórios, ≥ 32 caracteres, diferentes entre si). A VPS os gera em .env (deploy/preparar-api.sh).
    chave: ${CIFRA_CHAVE:}
    pepper: ${CIFRA_PEPPER:}
