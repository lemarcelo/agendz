spring:
  flyway:
    locations: classpath:db/migration,classpath:db/seed-dev
agendz:
  automacao:
    ativa: false   # nos testes a rotina é chamada à mão (AutomacaoAgendaTest), com a hora na mão
  interno:
    chave: chave-interna-so-para-teste-0123456789
  jwt:
    segredo: segredo-so-para-teste-com-mais-de-32-bytes-0123456789
    validade-minutos: 60
  cifra:
    chave: chave-de-cifra-so-para-teste-com-mais-de-32-bytes-0123
    pepper: pepper-so-para-teste-com-mais-de-32-bytes-0123456789
  dominios-base: agendz.io,localhost
  permitir-query: false
