  #     POSTGRES_DB: agendz
  #     POSTGRES_USER: agendz
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  #   volumes:
  #     - pg_data:/var/lib/postgresql/data
  #   # NUNCA publique a porta do banco (ports:). Docker ignora o firewall (ufw) para portas publicadas.
  # api:
  #   image: ghcr.io/SEU_USUARIO/agendz-api:latest
  #   restart: unless-stopped
  #   depends_on: [db]
  #   environment:
  #     SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/agendz
  #     SPRING_DATASOURCE_USERNAME: agendz
  #     SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
  #     JWT_SEGREDO: ${JWT_SEGREDO}
  #   # sem ports: só o Caddy fala com a API (reverse_proxy api:8080)

volumes:
  caddy_data:
  caddy_config:
