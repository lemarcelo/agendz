# Agendz na VPS: hoje só o Caddy servindo o front (protótipo). A API Spring e o PostgreSQL entram na F1 (blocos comentados abaixo).
# Uso: cp .env.example .env  (preencha)  &&  docker compose up -d
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMINIO: ${DOMINIO}
      EMAIL_ACME: ${EMAIL_ACME}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./site:/srv/site:ro
      - caddy_data:/data      # certificados: não apague
      - caddy_config:/config

  # ---- F1 (descomente quando a API existir) ----
